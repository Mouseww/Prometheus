[package]
name = "prometheus-server"
version = "0.1.12"
edition = "2024"
description = "Rust compatibility control plane for Prometheus"
license = "MIT"

[lib]
name = "prometheus_server"
path = "src/lib.rs"

[[bin]]
name = "prometheus-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "process", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
portable-pty = "0.8"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

