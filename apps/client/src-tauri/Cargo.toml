[package]
name = "prometheus"
version = "0.1.8"
description = "Prometheus cross-platform AI development client"
authors = ["Prometheus contributors"]
edition = "2021"

[lib]
name = "prometheus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
