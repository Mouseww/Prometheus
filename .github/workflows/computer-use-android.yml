name: computer-use-android

# Runs the adb (uiautomator) Android backend against an emulator's Settings app.
on:
  workflow_dispatch:
  push:
    # Branches only: a tag push ignores `paths` and would run this on every release.
    branches: ["**"]
    paths:
      - "plugins/computer-use/src/driver/adb.ts"
      - "plugins/computer-use/scripts/e2e-android.ts"
      - ".github/workflows/computer-use-android.yml"

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node --experimental-strip-types --no-warnings plugins/computer-use/scripts/e2e-android.ts
