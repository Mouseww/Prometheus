name: Release

on:
  push:
    tags: ["v*"]
  # Rebuilds only the Android APK and attaches it to an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APK to
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel builds the x64 app natively so npm installs x64 native deps and the x64 Node.
        os: [windows-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        shell: bash
        run: |
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$app" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != tauri.conf.json version v$app" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # Release notes live in .github/release-notes/<tag>.md so every release says what changed.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "Found $file"
            {
              echo "body<<__RELEASE_NOTES__"
              cat "$file"
              echo "__RELEASE_NOTES__"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$file is missing; falling back to a generic body"
            {
              echo "body<<__RELEASE_NOTES__"
              echo "See the assets below to download and install."
              echo "__RELEASE_NOTES__"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.bundle.json --verbose
          tagName: ${{ github.ref_name }}
          releaseName: Prometheus ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  android:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Install NDK
        run: |
          # The runner image already has an Android SDK; setup-android@v3 breaks on it (sdkmanager no longer has a `tools` package).
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sm" ] || sm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$sm" --licenses >/dev/null || true
          "$sm" --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build web UI and the Android server bundle
        run: |
          pnpm --filter @prometheus/web build
          pnpm --filter @prometheus/desktop bundle-server:android

      - name: Generate the Android project
        working-directory: apps/desktop
        run: pnpm tauri android init --ci

      - name: Apply the app icons
        run: |
          # `android init` writes Tauri's default launcher icons and never copies src-tauri/icons/android.
          res=apps/desktop/src-tauri/gen/android/app/src/main/res
          [ -d "$res" ] || { echo "no res dir at $res" >&2; exit 1; }
          cp -r apps/desktop/src-tauri/icons/android/. "$res/"
          test -f "$res/mipmap-anydpi-v26/ic_launcher.xml"
          test -f "$res/mipmap-xxxhdpi/ic_launcher_foreground.png"

      - name: Cache pinned Termux packages
        uses: actions/cache@v4
        with:
          path: .termux-cache
          key: termux-${{ hashFiles('apps/desktop/scripts/android-termux.lock.json') }}

      - name: Add Node, npm, git and the server to the project
        env:
          TERMUX_CACHE: ${{ github.workspace }}/.termux-cache
        run: pnpm --filter @prometheus/desktop android-runtime

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.p12"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            # No release key configured: sign with a throwaway key so the APK still installs, but it cannot upgrade a properly signed build.
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            KEY_ALIAS=prometheus
            keytool -genkeypair -storetype PKCS12 -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Prometheus CI"
            echo "suffix=-unofficial" >> "$GITHUB_OUTPUT"
          fi
          keytool -list -storetype PKCS12 -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null || { echo "cannot open the signing key: check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS" >&2; exit 1; }
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "KS_PATH=$ks" >> "$GITHUB_ENV"
          echo "KS_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: apps/desktop
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n1)
          [ -n "$apk" ] || { echo "no unsigned APK produced" >&2; exit 1; }
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks "$KS_PATH" --ks-type PKCS12 --ks-pass "pass:$KS_PASSWORD" --ks-key-alias "$KS_ALIAS" --out "Prometheus-${TAG}-android-arm64${{ steps.key.outputs.suffix }}.apk" aligned.apk
          # tauri-action creates the release; wait for it rather than racing the desktop jobs.
          for i in $(seq 1 30); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" Prometheus-*.apk --clobber

  # Intel Mac build for macOS 10.15 Catalina (e.g. MacBook Air 2013). The system WebKit there is Safari 13, which cannot run the
  # UI, so this flavour is an Electron shell (bundled Chromium 128, the last line that supports 10.15) around the same server and
  # web UI, with the server compiled for the Node 20 that Electron 32 embeds.
  macos-legacy:
    runs-on: macos-15-intel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      NODE_MAJOR: "20"
      SERVER_NODE_TARGET: node20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web UI, server bundle and npm runtime
        run: |
          pnpm --filter @prometheus/web build
          pnpm --filter @prometheus/desktop bundle-server
          pnpm --filter @prometheus/desktop bundle-node

      - name: Package the Electron app
        working-directory: packaging/legacy-mac
        run: |
          version="${TAG#v}"
          npm install --no-audit --no-fund
          npx electron-builder --mac dmg --x64 --publish never -c.extraMetadata.version="$version"

      - name: Check the build
        run: |
          app=$(find packaging/legacy-mac/dist -name 'Prometheus.app' -maxdepth 3 | head -n1)
          [ -n "$app" ] || { echo "no .app produced" >&2; exit 1; }
          plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist"
          ls "$app/Contents/Resources/server/main.js" "$app/Contents/Resources/server/web/index.html"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Prometheus" --version

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find packaging/legacy-mac/dist -name '*.dmg' | head -n1)
          [ -n "$dmg" ] || { echo "no DMG produced" >&2; exit 1; }
          # tauri-action creates the release; wait for it rather than racing the desktop jobs.
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" "$dmg" --clobber
