name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: prometheus-server.exe
            asset: prometheus-server-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: prometheus-server
            asset: prometheus-server-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: prometheus-server
            asset: prometheus-server-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: prometheus-server
            asset: prometheus-server-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Rust control plane
        run: cargo build --release --manifest-path apps/server-rs/Cargo.toml --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          src="apps/server-rs/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prometheus/protocol build && pnpm --filter @prometheus/client build
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-webui
          path: apps/client/dist

  publish:
    needs: [build, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release files
        run: |
          mkdir -p release
          find artifacts -type f -print
          cp artifacts/*/* release/ || true
          # flatten nested artifact dirs
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
