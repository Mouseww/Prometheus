name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PNPM_VERSION: "10.24.0"
  NODE_VERSION: "24"

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: prometheus-server.exe
            asset: prometheus-server-windows-x64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: prometheus-server
            asset: prometheus-server-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: prometheus-server
            asset: prometheus-server-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: prometheus-server
            asset: prometheus-server-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Rust control plane
        run: cargo build --release --manifest-path apps/server-rs/Cargo.toml --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          src="apps/server-rs/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prometheus/protocol build && pnpm --filter @prometheus/client build
      - name: Package WebUI zip
        run: |
          cd apps/client/dist
          zip -r "$GITHUB_WORKSPACE/prometheus-webui.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-webui
          path: prometheus-webui.zip

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            sidecar_name: prometheus-server-x86_64-pc-windows-msvc.exe
            server_bin: prometheus-server.exe
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            sidecar_name: prometheus-server-x86_64-unknown-linux-gnu
            server_bin: prometheus-server
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            sidecar_name: prometheus-server-aarch64-apple-darwin
            server_bin: prometheus-server
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            sidecar_name: prometheus-server-x86_64-apple-darwin
            server_bin: prometheus-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Linux WebKit deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build control-plane sidecar
        run: cargo build --release --manifest-path apps/server-rs/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Stage sidecar for Tauri externalBin
        shell: bash
        run: |
          mkdir -p apps/client/src-tauri/binaries
          src="apps/server-rs/target/${{ matrix.rust_target }}/release/${{ matrix.server_bin }}"
          cp "$src" "apps/client/src-tauri/binaries/${{ matrix.sidecar_name }}"
          ls -la apps/client/src-tauri/binaries
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri desktop installer
        working-directory: apps/client
        run: pnpm exec tauri build ${{ matrix.args }}
      - name: Collect desktop artifacts
        shell: bash
        run: |
          mkdir -p desktop-dist
          find apps/client/src-tauri/target -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.nsis.zip' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print -exec cp {} desktop-dist/ \; || true
          if [ -z "$(ls -A desktop-dist 2>/dev/null)" ]; then
            find apps/client/src-tauri/target -path '*/release/bundle/*' -type f -print -exec cp {} desktop-dist/ \; || true
          fi
          ls -laR desktop-dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rust_target }}
          path: desktop-dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "platform-tools"
          yes | sdkmanager --licenses || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prometheus/protocol build
      - name: Init Android project
        working-directory: apps/client
        env:
          CI: "true"
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm exec tauri android init --ci --skip-targets-install
          fi
      - name: Build Android APK
        working-directory: apps/client
        env:
          CI: "true"
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: pnpm exec tauri android build --apk --ci --config src-tauri/tauri.mobile.conf.json --target aarch64
      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p android-dist
          find apps/client/src-tauri/gen/android -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} android-dist/ \;
          ls -laR android-dist
      - name: Sign Android APK for sideload
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=$(find android-dist -type f -name '*.apk' | sed -n '1p')
          if [ -z "$UNSIGNED" ]; then
            echo 'No APK found to sign' >&2
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | sed -n '$p')
          KEYSTORE=apps/client/android/prometheus-debug.p12
          if [ ! -f "$KEYSTORE" ]; then
            echo "Missing $KEYSTORE" >&2
            exit 1
          fi
          ALIGNED=android-dist/prometheus-aligned.apk
          SIGNED=android-dist/prometheus-android-arm64-debugsigned.apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$KEYSTORE"             --ks-type PKCS12             --ks-pass pass:prometheus-debug             --ks-key-alias prometheusedebug             --key-pass pass:prometheus-debug             --out "$SIGNED"             "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          find android-dist -type f -name '*.apk' ! -name 'prometheus-android-arm64-debugsigned.apk' -delete
          rm -f "$ALIGNED"
          ls -laR android-dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-dist/*
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prometheus/protocol build
      - name: Configure iOS development team
        working-directory: apps/client
        env:
          TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: python3 scripts/configure_ios_team.py
      - name: Init iOS project
        working-directory: apps/client
        env:
          CI: "true"
        run: |
          if [ ! -d src-tauri/gen/apple ] && [ ! -d src-tauri/gen/ios ]; then
            pnpm exec tauri ios init --ci --skip-targets-install
          fi
          find src-tauri/gen -maxdepth 3 -type d -print || true
      - name: Build iOS app
        working-directory: apps/client
        env:
          CI: "true"
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: bash scripts/build_ios.sh
      - name: Collect iOS artifacts
        if: always()
        shell: bash
        run: bash apps/client/scripts/collect_ios_artifacts.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-artifacts
          path: ios-dist/*
          if-no-files-found: error

  publish:
    needs: [server, web, desktop, android, ios]
    runs-on: ubuntu-22.04
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.server.result == 'success' && needs.web.result == 'success' && needs.desktop.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release files
        run: python3 scripts/package_release_artifacts.py
      - name: Verify release package set
        run: |
          test -d release
          ls -la release
          test "$(ls -A release | wc -l)" -gt 0
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Prometheus multi-platform packages
            Desktop installers include the Rust control-plane sidecar.
            - Windows: NSIS setup.exe + MSI
            - macOS: DMG (arm64 / x64)
            - Linux: AppImage + deb + rpm
            - Android: arm64 APK debug-signed for sideload (not Play Store)
            - iOS: Xcode project / simulator artifacts when available; signed IPA requires IOS_DEVELOPMENT_TEAM
            - Server sidecars + WebUI zip are also attached
